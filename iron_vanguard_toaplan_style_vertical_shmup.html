    else if (e.type === 'tank') spr = e.flash > 0 ? SPRITES.tankFlash : SPRITES.tank;
    else if (e.type === 'turret') spr = e.flash > 0 ? SPRITES.turretFlash : SPRITES.turret;
    else if (e.type === 'midboss') {
      const s2 = game.stage === 2;
      spr = e.flash > 0 ? (s2 ? SPRITES.midboss2Flash : SPRITES.midbossFlash) : (s2 ? SPRITES.midboss2 : SPRITES.midboss);
    }

    if (spr) {
      ctx.drawImage(spr, Math.round(e.x - spr.width / 2), Math.round(e.y - spr.height / 2));
    }

    // Rotating cannon barrel for ground tanks & turrets
    if (e.type === 'turret' || e.type === 'tank') {
      ctx.save();
      ctx.translate(Math.round(e.x), Math.round(e.y));
      ctx.rotate(e.angle);
      ctx.fillStyle = '#0c1018';
      ctx.fillRect(0, -2, 10, 4);
      ctx.fillStyle = e.flash > 0 ? '#ffffff' : '#b4c6d9';
      ctx.fillRect(1, -1, 8, 2);
      ctx.restore();
    }
  }

  function drawBoss() {
    const isS2 = boss.stage === 2;
    const bodySpr = boss.coreFlash > 0
      ? (isS2 ? SPRITES.boss2BodyFlash : SPRITES.boss1BodyFlash)
      : (isS2 ? SPRITES.boss2Body : SPRITES.boss1Body);

    ctx.drawImage(bodySpr, Math.round(boss.x - bodySpr.width / 2), Math.round(boss.y - bodySpr.height / 2));

    // Glowing Phase 2 enraged core pulse
    if (boss.enraged && (game.tick >> 2) % 2 === 0 && !boss.dying) {
      ctx.fillStyle = isS2 ? '#99ffff' : '#ffdd55';
      ctx.fillRect(Math.round(boss.x - 8), Math.round(boss.y - 6), 16, 12);
    }

    // Destructible Wing Cannons
    const wingSprNorm = isS2 ? SPRITES.boss2Wing : SPRITES.boss1Wing;
    const wingSprFlash = isS2 ? SPRITES.boss2WingFlash : SPRITES.boss1WingFlash;
    for (const p of boss.parts) {
      const px = Math.round(boss.x + p.ox - p.w / 2);
      const py = Math.round(boss.y + p.oy - p.h / 2);
      if (p.alive) {
        ctx.drawImage(p.flash > 0 ? wingSprFlash : wingSprNorm, px, py);
      } else {
        ctx.drawImage(SPRITES.boss1WingBroken, px, py);
        // Smoking debris from destroyed wing
        if (game.tick % 9 === 0) {
          particles.push({
            type: 'puff',
            x: boss.x + p.ox + (Math.random() - 0.5) * 8,
            y: boss.y + p.oy,
            vx: (Math.random() - 0.5) * 0.4,
            vy: -0.6,
            r: 3,
            life: 0,
            maxLife: 18,
            color: '#555d6b'
          });
        }
      }
    }

    // Boss HP Bar at top
    if (!boss.dying) {
      const totalMax = boss.coreMaxHp + boss.parts.reduce((s, p) => s + p.maxHp, 0);
      const totalCur = Math.max(0, boss.coreHp) + boss.parts.reduce((s, p) => s + (p.alive ? Math.max(0, p.hp) : 0), 0);
      const ratio = Math.max(0, Math.min(1, totalCur / totalMax));
      const bw = 160;
      const bx = (W - bw) / 2;
      ctx.fillStyle = '#080c14';
      ctx.fillRect(bx - 1, 23, bw + 2, 6);
      ctx.fillStyle = '#3a111a';
      ctx.fillRect(bx, 24, bw, 4);
      ctx.fillStyle = boss.enraged ? '#ff2244' : '#ffaa22';
      ctx.fillRect(bx, 24, Math.round(bw * ratio), 4);
      drawPixelText(ctx, boss.name, W / 2, 31, '#ffdd88', 1, 'center');
    }
  }

  function drawPlayer() {
    if (!player.alive) return;
    if (player.invuln > 0 && (game.tick >> 2) % 2 === 0) return;

    const spr = player.bank < 0 ? SPRITES.playerLeft : player.bank > 0 ? SPRITES.playerRight : SPRITES.playerCenter;
    const px = Math.round(player.x - spr.width / 2);
    const py = Math.round(player.y - spr.height / 2);

    // Animated twin thruster flames
    const flameH = 4 + (game.tick % 4);
    ctx.fillStyle = '#ff6611';
    ctx.fillRect(px + 5, py + spr.height - 1, 2, flameH);
    ctx.fillRect(px + spr.width - 7, py + spr.height - 1, 2, flameH);
    ctx.fillStyle = '#ffee66';
    ctx.fillRect(px + 5, py + spr.height - 1, 2, Math.max(2, flameH - 2));
    ctx.fillRect(px + spr.width - 7, py + spr.height - 1, 2, Math.max(2, flameH - 2));

    ctx.drawImage(spr, px, py);

    // Subtle glowing precision hitbox core dot
    ctx.fillStyle = (game.tick >> 2) % 2 === 0 ? '#ffffff' : '#00f0ff';
    ctx.fillRect(Math.round(player.x - 1), Math.round(player.y - 1), 2, 2);
  }

  function drawPlayerBullets() {
    for (const b of pBullets) {
      const bx = Math.round(b.x);
      const by = Math.round(b.y);

      if (b.kind === 'vulcan') {
        ctx.fillStyle = '#ff2211';
        ctx.fillRect(bx - 2, by - 4, 4, 8);
        ctx.fillStyle = '#ffdd55';
        ctx.fillRect(bx - 1, by - 3, 2, 6);
      } else if (b.kind === 'rocket') {
        ctx.fillStyle = '#ff8800';
        ctx.fillRect(bx - 2, by - 4, 4, 8);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(bx - 1, by - 5, 2, 4);
      } else if (b.kind === 'laser') {
        ctx.fillStyle = '#0099ff';
        ctx.fillRect(bx - Math.floor(b.w / 2) - 1, by - 8, b.w + 2, 16);
        ctx.fillStyle = '#88f4ff';
        ctx.fillRect(bx - Math.floor(b.w / 2), by - 8, b.w, 16);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(bx, by - 8, 1, 16);
        // Electric crackling arc
        if (game.tick % 2 === 0) {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(bx + ((game.tick % 4) - 2), by - 4, 2, 2);
        }
      } else if (b.kind === 'plasma') {
        ctx.fillStyle = '#00bb44';
        ctx.fillRect(bx - 2, by - 5, 5, 10);
        ctx.fillStyle = '#aaffcc';
        ctx.fillRect(bx - 1, by - 4, 3, 8);
      } else if (b.kind === 'homing') {
        // Glowing emerald trail
        for (let t = 0; t < b.trail.length; t++) {
          ctx.fillStyle = `rgba(34, 255, 120, ${(t + 1) / 8})`;
          ctx.fillRect(Math.round(b.trail[t].x - 1), Math.round(b.trail[t].y - 1), 2, 2);
        }
        ctx.fillStyle = '#11ee55';
        ctx.fillRect(bx - 2, by - 3, 4, 6);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(bx - 1, by - 2, 2, 4);
      }
    }
  }

  function drawEnemyBullets() {
    const pulse = (game.tick >> 2) % 2 === 0;
    for (const b of eBullets) {
      const bx = Math.round(b.x);
      const by = Math.round(b.y);

      if (b.style === 'orb') {
        // Classic Toaplan high-contrast crimson rim + glowing white core
        ctx.fillStyle = pulse ? '#ff1144' : '#ff5522';
        ctx.fillRect(bx - 3, by - 2, 6, 4);
        ctx.fillRect(bx - 2, by - 3, 4, 6);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(bx - 1, by - 1, 2, 2);
      } else if (b.style === 'needle') {
        ctx.fillStyle = '#00ccff';
        ctx.fillRect(bx - 2, by - 3, 4, 6);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(bx - 1, by - 2, 2, 4);
      } else {
        // Orange spread pellet
        ctx.fillStyle = pulse ? '#ff8800' : '#ffdd22';
        ctx.fillRect(bx - 2, by - 2, 5, 5);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(bx - 1, by - 1, 2, 2);
      }
    }
  }

  function drawBombEffect() {
    const t = bombEffect.timer;
    const prog = t / bombEffect.maxTimer;
    const cx = Math.round(bombEffect.x);
    const cy = Math.round(bombEffect.y);
    const radius = 14 + prog * 185;

    ctx.save();
    // Expanding Plasma Shockwave Rings
    ctx.lineWidth = Math.max(2, (1 - prog) * 14);
    ctx.strokeStyle = t % 4 < 2 ? `rgba(255, 220, 60, ${1 - prog})` : `rgba(0, 230, 255, ${1 - prog})`;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.stroke();

    // Inner Fiery Core
    const coreR = Math.max(4, Math.sin(prog * Math.PI) * 68);
    ctx.fillStyle = `rgba(255, 90, 20, ${(1 - prog) * 0.55})`;
    ctx.beginPath();
    ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `rgba(255, 255, 220, ${(1 - prog) * 0.75})`;
    ctx.beginPath();
    ctx.arc(cx, cy, coreR * 0.55, 0, Math.PI * 2);
    ctx.fill();

    // Classic Truxton-inspired geometric energy rays
    ctx.strokeStyle = `rgba(255, 240, 150, ${(1 - prog) * 0.8})`;
    ctx.lineWidth = 2;
    for (let k = 0; k < 8; k++) {
      const ang = (k / 8) * Math.PI * 2 + prog * 2.5;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ang) * 12, cy + Math.sin(ang) * 12);
      ctx.lineTo(cx + Math.cos(ang) * (radius * 0.9), cy + Math.sin(ang) * (radius * 0.9));
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawParticles() {
    for (const pt of particles) {
      const prog = pt.life / pt.maxLife;
      const x = Math.round(pt.x);
      const y = Math.round(pt.y);

      if (pt.type === 'fireball') {
        const r = Math.round(pt.r + (pt.maxR - pt.r) * prog);
        ctx.fillStyle = prog < 0.25 ? '#ffffff' : prog < 0.55 ? '#ffee44' : prog < 0.8 ? '#ff5511' : '#553333';
        ctx.beginPath();
        ctx.arc(x, y, Math.max(1, r * (1 - prog * 0.35)), 0, Math.PI * 2);
        ctx.fill();
      } else if (pt.type === 'puff') {
        const r = Math.max(1, Math.round(pt.r * (1 - prog * 0.7)));
        ctx.fillStyle = prog < 0.3 ? '#ffff88' : prog < 0.7 ? pt.color : '#3a3a45';
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
      } else {
        ctx.fillStyle = prog < 0.5 ? '#ffffff' : pt.color;
        ctx.fillRect(x, y, 2, 2);
      }
    }
  }

  function drawHud() {
    // Top Arcade Status Strip
    drawPixelText(ctx, '1UP', 8, 4, '#ff4455', 1, 'left');
    drawPixelText(ctx, String(game.score).padStart(7, '0'), 8, 12, '#ffffff', 1, 'left');

    drawPixelText(ctx, 'HI-SCORE', W / 2, 4, '#ffbe2e', 1, 'center');
    drawPixelText(ctx, String(game.hiScore).padStart(7, '0'), W / 2, 12, '#ffffff', 1, 'center');

    const stLabel = `ST ${game.stage}-${game.loop}`;
    drawPixelText(ctx, stLabel, W - 8, 4, '#00e5ff', 1, 'right');

    // Bottom HUD: Lives, Bombs, Current Weapon & Level
    for (let i = 0; i < Math.max(0, player.lives); i++) {
      ctx.drawImage(SPRITES.hudLife, 6 + i * 10, H - 12);
    }
    for (let i = 0; i < Math.max(0, player.bombs); i++) {
      ctx.drawImage(SPRITES.hudBomb, W - 12 - i * 9, H - 12);
    }

    const wm = WEAPON_META[player.weapon];
    const wText = `${wm.name} LV${player.weaponLv === 5 ? 'MAX' : player.weaponLv}`;
    drawPixelText(ctx, wText, W / 2, H - 11, wm.color, 1, 'center');
  }

  function drawBossWarning() {
    if ((game.tick >> 3) % 2 === 0) {
      ctx.fillStyle = 'rgba(180, 0, 25, 0.45)';
      ctx.fillRect(0, 118, W, 44);
      ctx.fillStyle = '#ff2244';
      ctx.fillRect(0, 118, W, 2);
      ctx.fillRect(0, 160, W, 2);
      drawPixelText(ctx, 'WARNING!!', W / 2, 125, '#ffee33', 2, 'center');
      drawPixelText(ctx, 'HUGE BATTLESHIP APPROACHING', W / 2, 147, '#ffffff', 1, 'center');
    }
  }

  function renderTitleScreen() {
    // Semi-transparent dark gradient backdrop for readability
    ctx.fillStyle = 'rgba(4, 8, 18, 0.52)';
    ctx.fillRect(0, 0, W, H);

    // Metallic Logo Plate
    drawPixelText(ctx, 'IRON', W / 2, 34, '#00e5ff', 3, 'center', '#081830');
    drawPixelText(ctx, 'VANGUARD', W / 2, 62, '#ff3355', 3, 'center', '#2e050d');
    drawPixelText(ctx, 'TOAPLAN-STYLE ARCADE STG', W / 2, 92, '#ffbe2e', 1, 'center');

    // Showcase Player Sprite
    ctx.drawImage(SPRITES.playerCenter, Math.round(W / 2 - 9), 108);

    // Weapon Legend Box
    ctx.fillStyle = 'rgba(10, 16, 28, 0.82)';
    ctx.fillRect(16, 136, W - 32, 74);
    ctx.strokeStyle = '#2d4063';
    ctx.strokeRect(16.5, 136.5, W - 33, 73);

    drawPixelText(ctx, 'CYCLING WEAPON ORBS', W / 2, 143, '#ffffff', 1, 'center');

    ctx.drawImage(SPRITES.orbRed, 24, 156);
    drawPixelText(ctx, 'RED: SPREAD VULCAN', 44, 160, '#ff6655', 1, 'left');

    ctx.drawImage(SPRITES.orbBlue, 24, 174);
    drawPixelText(ctx, 'BLUE: THUNDER LASER', 44, 178, '#44ddff', 1, 'left');

    ctx.drawImage(SPRITES.orbGreen, 24, 192);
    drawPixelText(ctx, 'GREEN: HOMING PLASMA', 44, 196, '#44ff88', 1, 'left');

    // Controls Guide
    drawPixelText(ctx, 'MOVE: ARROWS / WASD / DRAG', W / 2, 224, '#b8c9e0', 1, 'center');
    drawPixelText(ctx, 'FIRE: Z / SPACE  BOMB: X / SHIFT', W / 2, 236, '#b8c9e0', 1, 'center');

    // Blinking Start Prompt
    if ((game.tick >> 4) % 2 === 0) {
      drawPixelText(ctx, 'PRESS Z / SPACE OR CLICK', W / 2, 264, '#ffee44', 1, 'center');
      drawPixelText(ctx, 'TO START', W / 2, 276, '#ffffff', 1, 'center');
    }

    drawPixelText(ctx, `HI-SCORE ${String(game.hiScore).padStart(7, '0')}`, W / 2, 300, '#ffbe2e', 1, 'center');
  }

  function drawStageClearOverlay() {
    ctx.fillStyle = 'rgba(5, 10, 22, 0.68)';
    ctx.fillRect(18, 92, W - 36, 128);
    ctx.strokeStyle = '#00e5ff';
    ctx.strokeRect(18.5, 92.5, W - 37, 127);

    drawPixelText(ctx, `STAGE ${game.stage} CLEAR!`, W / 2, 106, '#00e5ff', 2, 'center');

    const clearBonus = game.stage * 5000 * game.loop;
    const bombBonus = player.bombs * 2000;
    const noMissBonus = game.stageMissed ? 0 : 10000;

    drawPixelText(ctx, `CLEAR BONUS   +${clearBonus}`, W / 2, 136, '#ffffff', 1, 'center');
    drawPixelText(ctx, `BOMB BONUS    +${bombBonus}`, W / 2, 152, '#ff88ee', 1, 'center');
    drawPixelText(ctx, `NO-MISS BONUS +${noMissBonus}`, W / 2, 168, noMissBonus > 0 ? '#22ff88' : '#778899', 1, 'center');

    const nextStr = game.stage === 1 ? 'NEXT: STAGE 2 ORBITAL' : `NEXT: LOOP ${game.loop + 1}!`;
    drawPixelText(ctx, nextStr, W / 2, 196, '#ffbe2e', 1, 'center');
  }

  function drawGameOverOverlay() {
    ctx.fillStyle = 'rgba(10, 4, 8, 0.72)';
    ctx.fillRect(0, 0, W, H);
    drawPixelText(ctx, 'GAME OVER', W / 2, 118, '#ff3355', 2, 'center');
    drawPixelText(ctx, `FINAL SCORE: ${game.score}`, W / 2, 152, '#ffffff', 1, 'center');
    drawPixelText(ctx, `HI-SCORE: ${game.hiScore}`, W / 2, 166, '#ffbe2e', 1, 'center');
    if ((game.tick >> 4) % 2 === 0) {
      drawPixelText(ctx, 'PRESS Z / SPACE OR CLICK', W / 2, 206, '#00e5ff', 1, 'center');
      drawPixelText(ctx, 'TO TRY AGAIN', W / 2, 218, '#ffffff', 1, 'center');
    }
  }

  function drawPauseOverlay() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
    ctx.fillRect(0, 0, W, H);
    drawPixelText(ctx, 'PAUSED', W / 2, 146, '#ffffff', 2, 'center');
    drawPixelText(ctx, 'PRESS P TO RESUME', W / 2, 172, '#00e5ff', 1, 'center');
  }

  /* =========================================================================
     14. BOOTSTRAP & LOCKED 60FPS FIXED-TIMESTEP LOOP
     ========================================================================= */
  buildAllSprites();

  let lastTime = performance.now();
  let accumulator = 0;

  function mainLoop(now) {
    const dt = Math.min(100, now - lastTime);
    lastTime = now;
    accumulator += dt;

    while (accumulator >= FIXED_STEP) {
      updateGame();
      accumulator -= FIXED_STEP;
    }

    renderGame();
    requestAnimationFrame(mainLoop);
  }

  window.onload = function () {
    lastTime = performance.now();
    requestAnimationFrame(mainLoop);
  };
})();
</script>
